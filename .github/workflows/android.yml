name: Compiler l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer et synchroniser
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          npm ci
          npx cap sync android

      - name: Compiler
        working-directory: android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace > ../build.log 2>&1
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            msg=$( (grep -A25 "What went wrong" ../build.log || tail -40 ../build.log) | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle::$msg"
            exit $code
          fi
          cp app/build/outputs/apk/release/app-release.apk ../MonProgFoot.apk

      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Mon Prog Foot 1.0.${{ github.run_number }}
          make_latest: true
          body: Télécharge MonProgFoot.apk depuis ton téléphone Android et ouvre-le pour l'installer.
          files: MonProgFoot.apk
